name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # FIX 1 (Auth): Log in to Docker Hub using repository secrets before pushing
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # FIX 2 (Tagging): Tag the image with username/app:sha (and latest) instead of myapp:latest
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/app:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USER }}/app:latest

  # FIX 3 (Sequencing): Add `needs: build` so deploy runs only after build & push succeeds
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USER }}/app:${{ github.sha }}
        run: |
          docker compose up -d
          sleep 5
          curl -f http://localhost:8080/health

